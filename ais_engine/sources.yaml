# AIS 全局高价值信源库 (Master Sources Database)
# 手动维护，作为系统最核心的数据资产
#
# -------------------------------------------------------------
# 【架构说明 - Data Schema】
# - id: 唯一标识符 (全局唯一, 推荐使用 类别_名称 格式)
# - name: 信源显示名称
# - type: 接入类型 (rss | arxiv | github_trending | twitter_user | web_scrape | newsletter)
# - url: 抓取地址 / 分类 Tag / API Endpoint
# - domain: 宏观领域 (AI | Web3 | Biotech | Tech_Biz | Macro | Science)
# - tags: [标签列表] (颗粒度更细的标签，用于后续精准匹配)
# - priority: 权重参数 (1-5, 5为最高。核心 Alpha 信源设为 4-5)
# - language: 语言 (en | zh，指导 LLM 处理时的默认翻译策略)
# - frequency_hint: 抓取频率建议 (realtime | hourly | daily | weekly)
# - auth_required: 是否需要鉴权/Cookie (true/false, 默认 false)
# - active: 启用开关 (true/false)
# - description: 为什么关注该信源的核心理由 (业务备注)
# -------------------------------------------------------------

sources:
  # ==========================================
  # 领域一：人工智能与大模型 (Artificial Intelligence)
  # 极致前沿：实验室一手预印本、核心开发者博客、对齐与哲学探讨
  # ==========================================
  - id: "arxiv_cs_ai_lg_cl"
    name: "ArXiv - AI / ML / Computation"
    type: "arxiv"
    url: "cs.AI+OR+cs.LG+OR+cs.CL+OR+cs.CV"
    domain: "AI"
    tags: ["papers", "algorithm", "LLM"]
    priority: 5
    language: "en"
    frequency_hint: "daily"
    active: true
    description: "追踪全球最新 AI 顶会及大厂实验室的一手预印本论文（每日过滤最硬核的几篇）"

  - id: "rss_import_ai"
